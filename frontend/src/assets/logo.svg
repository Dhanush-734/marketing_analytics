<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    {/* Primary Blue-to-Purple Gradient */}
    <linearGradient id="logoPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2563EB" />
      <stop offset="100%" stopColor="#7C3AED" />
    </linearGradient>

    {/* Circular Ring Gradient */}
    <linearGradient id="logoCircleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#1E3A8A" />
      <stop offset="50%" stopColor="#2563EB" />
      <stop offset="100%" stopColor="#7C3AED" />
    </linearGradient>
  </defs>

  {/* 1. Circular Emblem Outline */}
  <path
    d="M 370,140 A 160,160 0 1,0 345,305"
    fill="none"
    stroke="url(#logoCircleGrad)"
    strokeWidth="16"
    strokeLinecap="round"
  />

  {/* 2. Data Nodes and Connected Analytics Lines (Upper Left) */}
  <path
    d="M 185,185 L 205,150 L 225,160 L 245,125"
    fill="none"
    stroke="#2563EB"
    strokeWidth="4"
    strokeLinecap="round"
    strokeLinejoin="round"
    opacity="0.9"
  />
  <circle cx="185" cy="185" r="7" fill="#0F172A" />
  <circle cx="205" cy="150" r="7" fill="#2563EB" />
  <circle cx="225" cy="160" r="7" fill="#2563EB" />
  <circle cx="245" cy="125" r="7" fill="#A855F7" />

  {/* 3. Stylized 3D "I" Pillars */}
  {/* Left "I" Pillar */}
  <polygon points="215,200 235,190 235,340 215,340" fill="#0F172A" />
  <polygon points="235,190 255,180 255,340 235,340" fill="#1E293B" />

  {/* Right "I" Pillar */}
  <polygon points="270,150 290,140 290,340 270,340" fill="#0F172A" />
  <polygon points="290,140 310,130 310,340 290,340" fill="#1E293B" />

  {/* 4. Upward Growth Arrow Winding Through */}
  <path
    d="M 215,270 L 260,220 L 285,240 L 380,145"
    fill="none"
    stroke="url(#logoPrimaryGrad)"
    strokeWidth="16"
    strokeLinecap="round"
    strokeLinejoin="round"
  />
  <polygon points="360,135 395,130 390,165" fill="url(#logoPrimaryGrad)" />
</svg>
