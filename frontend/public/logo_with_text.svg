<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 560" width="100%" height="100%">
  <defs>
    <!-- Primary Blue-to-Purple Gradient -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Circular Ring Gradient -->
    <linearGradient id="circleGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <!-- 1. Circular Emblem Outline -->
  <path d="M 370,140 A 160,160 0 1,0 345,305" fill="none" stroke="url(#circleGradient)" stroke-width="16" stroke-linecap="round" />

  <!-- 2. Data Nodes and Connected Analytics Lines (Upper Left) -->
  <path d="M 185,185 L 205,150 L 225,160 L 245,125" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  <circle cx="185" cy="185" r="7" fill="#0F172A" />
  <circle cx="205" cy="150" r="7" fill="#2563EB" />
  <circle cx="225" cy="160" r="7" fill="#2563EB" />
  <circle cx="245" cy="125" r="7" fill="#7C3AED" />

  <!-- 3. Stylized "I" Pillars (Insight Innovators) -->
  <!-- Left "I" Pillar (with 3D bevel effect) -->
  <!-- Left half -->
  <polygon points="215,200 235,190 235,340 215,340" fill="#1E293B" />
  <!-- Right half -->
  <polygon points="235,190 255,180 255,340 235,340" fill="#0F172A" />

  <!-- Right "I" Pillar (with 3D bevel effect) -->
  <!-- Left half -->
  <polygon points="270,150 290,140 290,340 270,340" fill="#1E293B" />
  <!-- Right half -->
  <polygon points="290,140 310,130 310,340 290,340" fill="#0F172A" />

  <!-- 4. Upward Growth Arrow (Winding through and shooting up) -->
  <!-- Growth Line -->
  <path d="M 215,270 L 260,220 L 285,240 L 380,145" fill="none" stroke="url(#primaryGradient)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Arrow Head pointing up-right at 45 degrees -->
  <polygon points="360,135 395,130 390,165" fill="url(#primaryGradient)" />

  <!-- 5. Typography -->
  <!-- Team Name -->
  <text x="256" y="445" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="34" font-weight="800" text-anchor="middle" letter-spacing="4">
    <tspan fill="#0F172A">INSIGHT </tspan>
    <tspan fill="url(#primaryGradient)">INNOVATORS</tspan>
  </text>

  <!-- Tagline -->
  <line x1="60" y1="490" x2="150" y2="490" stroke="#0F172A" stroke-width="1.5" opacity="0.4" />
  <text x="256" y="495" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle" letter-spacing="5" opacity="0.8">
    DATA • INSIGHT • IMPACT
  </text>
  <line x1="362" y1="490" x2="452" y2="490" stroke="#0F172A" stroke-width="1.5" opacity="0.4" />
</svg>
