services:
  - type: web
    name: marketing-analytics-platform
    runtime: node
    plan: free
    buildCommand: "npm --prefix frontend install && npm --prefix frontend run build"
    startCommand: "npm --prefix frontend run preview -- --host 0.0.0.0 --port $PORT"
    envVars:
      - key: VITE_SNOWFLAKE_USER
        sync: false
      - key: VITE_SNOWFLAKE_ACCOUNT
        sync: false
      - key: VITE_SNOWFLAKE_WAREHOUSE
        value: MARKETING_WH
      - key: VITE_SNOWFLAKE_DATABASE
        value: MARKETING_ANALYTICS
      - key: VITE_SNOWFLAKE_SCHEMA
        value: MARKETING_SCHEMA
